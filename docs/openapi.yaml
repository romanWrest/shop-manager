  "info": {
    "title": "Shop Terminals Management API",
    "description": "",
    "version": "1.0",
    "contact": {

    }
  },
  "tags": [
    {
      "name": "Аутентификация",
      "description": "Вход в систему, выход, обновление токена"
    },
    {
      "name": "Администраторы",
      "description": "Управление администраторами системы (ROOT, MANAGER)"
    },
    {
      "name": "Владельцы магазинов",
      "description": "Управление владельцами торговых точек"
    },
    {
      "name": "Магазины",
      "description": "Управление торговыми точками"
    },
    {
      "name": "Терминалы",
      "description": "Управление терминалами и их статусами"
    },
    {
      "name": "Заявки",
      "description": "Управление заявками на подключение терминалов"
    },
    {
      "name": "Профиль",
      "description": "Управление профилем текущего пользователя"
    }
  ],
  "servers": [],
  "components": {
    "securitySchemes": {
      "JWT-auth": {
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "type": "http",
        "name": "JWT",
        "description": "Введите JWT токен полученный при авторизации",
        "in": "header"
      }
    },
    "schemas": {
      "LoginAdminDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "example": "root@example.com",
            "description": "Email администратора"
          },
          "password": {
            "type": "string",
            "example": "rootpass123",
            "description": "Пароль (минимум 6 символов)"
          }
        },
        "required": [
          "email",
          "password"
        ]
      },
      "LoginShopDto": {
        "type": "object",
        "properties": {
          "login": {
            "type": "string",
            "example": "shop1",
            "description": "Логин магазина"
          },
          "password": {
            "type": "string",
            "example": "shoppass123",
            "description": "Пароль (минимум 6 символов)"
          }
        },
        "required": [
          "login",
          "password"
        ]
      },
      "RefreshTokenDto": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "example": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
            "description": "JWT токен для обновления"
          }
        },
        "required": [
          "token"
        ]
      },
      "CreateAdminDto": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "example": "Имя Фамилия",
            "description": "Полное имя администратора"
          },
          "email": {
            "type": "string",
            "example": "manager@example.com",
            "description": "Email администратора, unique"
          },
          "password": {
            "type": "string",
            "example": "123456",
            "description": "Пароль (минимум 6 символов)"
          }
        },
        "required": [
          "name",
          "email",
          "password"
        ]
      },
      "UpdatePasswordDto": {
        "type": "object",
        "properties": {
          "newPassword": {
            "type": "string",
            "example": "newsecurepass456",
            "description": "Новый пароль (минимум 6 символов)"
          }
        },
        "required": [
          "newPassword"
        ]
      },
      "CreateShopOwnerDto": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "example": "ИП Иванов Иван Иванович",
            "description": "Полное наименование владельца магазина (ФИО или название организации)"
          },
          "phone": {
            "type": "string",
            "example": "+79001234567",
            "description": "Контактный телефон"
          },
          "email": {
            "type": "string",
            "example": "ivanov@example.com",
            "description": "Email для связи"
          },
          "address": {
            "type": "string",
            "example": "г. Ростов-на-Донц, ул. Соколова 76",
            "description": "Адрес регистрации владельца"
          },
          "inn": {
            "type": "string",
            "example": "123456789012",
            "description": "ИНН (для юридических лиц и ИП)"
          }
        },
        "required": [
          "name",
          "phone"
        ]
      },
      "UpdateShopOwnerDto": {
        "type": "object",
        "properties": {

        }
      },
      "CreateShopDto": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "example": "Магазин \"Продукты 24\"",
            "description": "Наименование торговой точки"
          },
          "address": {
            "type": "string",
            "example": "г. Москва, ул. Тверская, д. 5",
            "description": "Адрес магазина"
          },
          "inn": {
            "type": "string",
            "example": "7707083893",
            "description": "ИНН организации (10 или 12 цифр)"
          },
          "kpp": {
            "type": "string",
            "example": "770701001",
            "description": "КПП (для юридических лиц)"
          },
          "ogrn": {
            "type": "string",
            "example": "1027700132195",
            "description": "ОГРН (для юридических лиц)"
          },
          "login": {
            "type": "string",
            "example": "shop_24_tverskaya",
            "description": "Логин для входа в систему (должен быть уникальным)"
          },
          "password": {
            "type": "string",
            "example": "secureShopPass123",
            "description": "Пароль для входа (минимум 6 символов)"
          },
          "ownerId": {
            "type": "string",
            "example": "adcbd5f2-6b80-4987-9035-11f868b073a3",
            "description": "ID владельца магазина (UUID)"
          }
        },
        "required": [
          "name",
          "address",
          "inn",
          "login",
          "password",
          "ownerId"
        ]
      },
      "UpdateShopCredentialsDto": {
        "type": "object",
        "properties": {

        }
      },
      "CreateTerminalDto": {
        "type": "object",
        "properties": {
          "macAddress": {
            "type": "string",
            "example": "AA:BB:CC:DD:EE:FF",
            "description": "MAC адрес терминала"
          },
          "shopId": {
            "type": "string",
            "example": "uuid-shop-id",
            "description": "ID магазина"
          }
        },
        "required": [
          "macAddress"
        ]
      },
      "UpdateTerminalDto": {
        "type": "object",
        "properties": {
          "macAddress": {
            "type": "string",
            "example": "AA:BB:CC:DD:EE:FF"
          },
          "status": {
            "type": "string",
            "example": "ACTIVE",
            "enum": [
              "ACTIVE",
              "INACTIVE"
            ]
          },
          "shopId": {
            "type": "string",
            "example": "uuid-shop-id"
          }
        }
      },
      "UpdateTerminalStatusDto": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "example": "ACTIVE",
            "enum": [
              "ACTIVE",
              "INACTIVE"
            ],
            "description": "Новый статус терминала"
          }
        },
        "required": [
          "status"
        ]
      },
      "TerminalHeartbeatDto": {
        "type": "object",
        "properties": {
          "macAddress": {
            "type": "string",
            "example": "AA:BB:CC:DD:EE:FF",
            "description": "MAC адрес терминала"
          }
        },
        "required": [
          "macAddress"
        ]
      },
      "CreateRequestDto": {
        "type": "object",
        "properties": {
          "terminalId": {
            "type": "string",
            "example": "uuid-terminal-id",
            "description": "ID терминала"
          },
          "shopLogin": {
            "type": "string",
            "example": "shop1",
            "description": "Логин магазина"
          }
        },
        "required": [
          "terminalId",
          "shopLogin"
        ]
      },
      "AddCommentDto": {
        "type": "object",
        "properties": {
          "comment": {
            "type": "string",
            "example": "Заявка одобрена после проверки документов",
            "description": "Комментарий к заявке"
          }
        },
        "required": [
          "comment"
        ]
      },
      "ChangePasswordDto": {
        "type": "object",
        "properties": {
          "currentPassword": {
            "type": "string",
            "example": "changeMe",
            "description": "Текущий пароль"
          },
          "newPassword": {
            "type": "string",
            "example": "newPassword",
            "description": "Новый пароль (минимум 6 символов)"
          }
        },
        "required": [
          "currentPassword",
          "newPassword"
        ]
      }
    }
  }
}